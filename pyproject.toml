[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lecture-distillation-engine"
version = "0.1.0"
description = "Transform long-form lectures into engaging short-form content using AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Transcription
    "faster-whisper>=1.0.0",
    "openai-whisper>=20231117",  # fallback, for model compatibility
    # LLM
    "anthropic>=0.40.0",
    # Audio/Video processing
    "ffmpeg-python>=0.2.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    # Embeddings + NLP
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # HTTP / downloading
    "yt-dlp>=2024.1.0",
    "httpx>=0.25.0",
    # Utilities
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "types-tqdm",
]

[project.scripts]
distill = "distillation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/distillation"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short"
